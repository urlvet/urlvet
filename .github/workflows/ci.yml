name: CI

# Disabled for now: runs only when started by hand from the Actions tab.
# Restore the two triggers below to turn it back on.
on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main, dev]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      # Same build the prod image runs (adapter-static).
      - run: npm run build
        env:
          DOCKER_BUILD: 1

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/chrome-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/chrome-extension/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go build ./...
      - run: go vet ./...
      # Fails only on vulnerabilities the code actually reaches.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
