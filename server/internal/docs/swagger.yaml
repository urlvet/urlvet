basePath: /api/v1
definitions:
  analyzer.Analysis:
    properties:
      http_status:
        allOf:
        - $ref: '#/definitions/analyzer.HTTPStatus'
        description: |-
          RedirectionChain       []string   `json:"redirection_chain"`
          RedirectionChainLength int        `json:"redirection_chain_length"`
          RedirectionFinalURL    string     `json:"redirection_final_url"`
      is_hsts_supported:
        type: boolean
      redirection_result:
        $ref: '#/definitions/checks.RedirectionResult'
    type: object
  analyzer.Features:
    properties:
      rank:
        type: integer
      tld:
        $ref: '#/definitions/analyzer.TLDInfo'
      url:
        $ref: '#/definitions/analyzer.URLChecks'
    type: object
  analyzer.HTTPStatus:
    properties:
      code:
        type: integer
      is_redirect:
        type: boolean
      success:
        type: boolean
      text:
        type: string
    type: object
  analyzer.Infrastructure:
    properties:
      ip_addresses:
        items:
          type: string
        type: array
      mx_hosts:
        items:
          type: string
        type: array
      mx_records_valid:
        type: boolean
      nameservers_valid:
        type: boolean
      ns_hosts:
        items:
          type: string
        type: array
    type: object
  analyzer.Keywords:
    properties:
      categories:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      found:
        items:
          type: string
        type: array
      has_keywords:
        type: boolean
    type: object
  analyzer.OriginFindings:
    properties:
      bad_reasons:
        items:
          type: string
        type: array
      confirmed:
        description: |-
          Confirmed is set when a list names the link or a hop: the result is
          Risky, whatever the destination looks like.
        type: boolean
      risk:
        type: integer
      url:
        type: string
    type: object
  analyzer.Performance:
    properties:
      timings:
        items:
          $ref: '#/definitions/analyzer.TimingEntry'
        type: array
      total_time:
        type: string
    type: object
  analyzer.PhishingResult:
    properties:
      from_cache:
        type: boolean
      in_database:
        type: boolean
      phish_detail_page:
        type: string
      phish_id:
        type: integer
      raw_response:
        type: object
      source:
        type: string
      target:
        type: string
      valid:
        type: boolean
      verified:
        type: boolean
      verified_at:
        type: string
    type: object
  analyzer.Reasons:
    properties:
      bad_reasons:
        items:
          type: string
        type: array
      good_reasons:
        items:
          type: string
        type: array
      neutral_reasons:
        items:
          type: string
        type: array
    type: object
  analyzer.RedirectInfo:
    properties:
      chain:
        description: the redirect chain, starting with URL
        items:
          type: string
        type: array
      target:
        description: where it leads; the page the scan describes
        type: string
      url:
        description: the link as submitted
        type: string
    type: object
  analyzer.Response:
    properties:
      analysis:
        $ref: '#/definitions/analyzer.Analysis'
      content_data:
        $ref: '#/definitions/checks.PageFormResult'
      domain:
        type: string
      domain_info:
        $ref: '#/definitions/domaininfo.RegistrationData'
      domain_randomness:
        $ref: '#/definitions/checks.DomainRandomnessResult'
      errors:
        items:
          type: string
        type: array
      features:
        $ref: '#/definitions/analyzer.Features'
      incomplete:
        description: |-
          Incomplete means signals are missing in a way that a rescan could fix, so
          the result isn't cached. IncompleteChecks names every task that didn't
          finish, including ones that don't make the result incomplete (a PhishTank
          rate limit), so the UI can say what wasn't checked.
        type: boolean
      incomplete_checks:
        items:
          type: string
        type: array
      infrastructure:
        $ref: '#/definitions/analyzer.Infrastructure'
      origin:
        allOf:
        - $ref: '#/definitions/analyzer.OriginFindings'
        description: |-
          Origin is what the submitted link itself, and the hops after it, add to
          that site's result: risk only, already counted in Result.
      performance:
        $ref: '#/definitions/analyzer.Performance'
      phishing:
        $ref: '#/definitions/analyzer.PhishingResult'
      redirected_from:
        allOf:
        - $ref: '#/definitions/analyzer.RedirectInfo'
        description: |-
          RedirectedFrom is set when the submitted link sent visitors on to
          another site; everything else describes that site.
      result:
        $ref: '#/definitions/analyzer.Result'
      safe_browsing:
        allOf:
        - $ref: '#/definitions/threatfeeds.GoogleThreatResult'
        description: SafeBrowsing is Google Safe Browsing's verdict; absent when it
          isn't configured.
      short_link:
        allOf:
        - $ref: '#/definitions/analyzer.ShortLinkInfo'
        description: |-
          ShortLink is set when the submitted link was on a URL shortener. When
          it resolved, everything else describes the page it leads to.
      ssl_info:
        $ref: '#/definitions/checks.SSLCertResult'
      threat_feeds:
        allOf:
        - $ref: '#/definitions/threatfeeds.FeedMatch'
        description: |-
          ThreatFeeds is the match against locally held phishing and malware
          lists (PhishTank's dump, plus OpenPhish and URLhaus when enabled).
      tls_info:
        $ref: '#/definitions/checks.TLSResult'
      typosquat_result:
        $ref: '#/definitions/typosquat.TyposquatResult'
      url:
        type: string
      web_risk:
        allOf:
        - $ref: '#/definitions/threatfeeds.GoogleThreatResult'
        description: WebRisk is Google Web Risk's verdict; absent when it isn't configured.
    type: object
  analyzer.Result:
    properties:
      final_score:
        type: integer
      reasons:
        $ref: '#/definitions/analyzer.Reasons'
      risk_score:
        type: integer
      trust_score:
        type: integer
      verdict:
        type: string
    type: object
  analyzer.ShortLinkInfo:
    properties:
      chain:
        description: every link followed, starting with URL
        items:
          type: string
        type: array
      resolved:
        description: 'false: the destination couldn''t be found'
        type: boolean
      target:
        description: where it leads; the page the scan describes
        type: string
      url:
        description: the short link as submitted
        type: string
    type: object
  analyzer.TLDInfo:
    properties:
      is_hosting_platform:
        type: boolean
      is_icann:
        type: boolean
      is_risky_tld:
        type: boolean
      is_trusted_tld:
        type: boolean
      tld:
        type: string
    type: object
  analyzer.TimingEntry:
    properties:
      task:
        type: string
      time:
        type: string
    type: object
  analyzer.URLChecks:
    properties:
      contains_punycode:
        type: boolean
      has_homoglyph:
        type: boolean
      keywords:
        $ref: '#/definitions/analyzer.Keywords'
      subdomain_count:
        type: integer
      too_deep:
        type: boolean
      too_long:
        type: boolean
      url_shortener:
        type: boolean
      uses_ip:
        type: boolean
    type: object
  checks.BrandResult:
    properties:
      brand_found:
        type: string
      detected_names:
        items:
          type: string
        type: array
      is_mismatch:
        type: boolean
      official_domain:
        description: |-
          OfficialDomain is the brand's own site when the page claims to be a brand
          this domain doesn't belong to, so the UI can point people to the real one.
        type: string
    type: object
  checks.DomainRandomnessResult:
    properties:
      bigramEnglishiness:
        format: float64
        type: number
      digitRatio:
        format: float64
        type: number
      domain:
        type: string
      entropy:
        format: float64
        type: number
      entropyPerChar:
        format: float64
        type: number
      isSuspicious:
        type: boolean
      label:
        type: string
      length:
        type: integer
      longestConsonantRun:
        type: integer
      normalizedEntropy:
        format: float64
        type: number
      randomnessScore:
        format: float64
        type: number
      reasons:
        items:
          type: string
        type: array
      uniqueCharRatio:
        format: float64
        type: number
      vowelRatio:
        format: float64
        type: number
    type: object
  checks.FormInfo:
    properties:
      action:
        description: resolved absolute action URL (may be empty -> current URL)
        type: string
      has_password:
        type: boolean
      has_payment:
        description: credit card, money, etc.
        type: boolean
      has_personal:
        description: address, phone, ssn, etc.
        type: boolean
      has_user_like:
        description: username/email-like inputs
        type: boolean
      inputs:
        description: raw input names/types/placeholder snippets
        items:
          type: string
        type: array
      is_external:
        description: action host != page host (true if external)
        type: boolean
      is_hidden:
        type: boolean
      login_intent:
        description: button, label or action says sign in / next / verify
        type: boolean
      method:
        description: GET/POST etc.
        type: string
      submit_texts:
        items:
          type: string
        type: array
    type: object
  checks.IframeInfo:
    properties:
      height:
        type: string
      is_hidden:
        type: boolean
      src:
        type: string
      width:
        type: string
    type: object
  checks.PageFormResult:
    properties:
      brand_check:
        $ref: '#/definitions/checks.BrandResult'
      content_type:
        description: |-
          Set for responses that aren't web pages (installers, archives, images):
          those aren't parsed, and FileName is what the download would be saved as.
        type: string
      fetch_duration:
        description: nanoseconds
        type: integer
      file_name:
        type: string
      form_count:
        type: integer
      forms:
        items:
          $ref: '#/definitions/checks.FormInfo'
        type: array
      has_forms:
        type: boolean
      has_hidden_iframe:
        type: boolean
      has_login_form:
        type: boolean
      has_payment_form:
        type: boolean
      has_personal_form:
        type: boolean
      has_tracking:
        description: detection of 1x1 pixels etc.
        type: boolean
      iframes:
        items:
          $ref: '#/definitions/checks.IframeInfo'
        type: array
      provider_block:
        allOf:
        - $ref: '#/definitions/checks.ProviderBlock'
        description: |-
          ProviderBlock is set when the page is the host's or CDN's own warning
          or takedown page instead of the site (Cloudflare's phishing interstitial).
      script_redirect:
        $ref: '#/definitions/checks.ScriptRedirect'
      title:
        type: string
      url:
        type: string
    type: object
  checks.ProviderBlock:
    properties:
      provider:
        type: string
      reason:
        description: '"phishing", "malware" or "blocked"'
        type: string
    type: object
  checks.RedirectionResult:
    properties:
      chain:
        items:
          type: string
        type: array
      chain_length:
        type: integer
      final_url:
        type: string
      final_url_domain:
        type: string
      has_domain_jump:
        type: boolean
      is_redirected:
        type: boolean
    type: object
  checks.SSLCertResult:
    properties:
      ageDays:
        type: integer
      chainValid:
        type: boolean
      ctlogged:
        type: boolean
      domain:
        type: string
      fingerprint:
        type: string
      hasTLS:
        type: boolean
      isSuspicious:
        type: boolean
      issuer:
        type: string
      knownBadChain:
        type: boolean
      notAfter:
        type: string
      notBefore:
        type: string
      reasons:
        items:
          type: string
        type: array
    type: object
  checks.ScriptRedirect:
    properties:
      cross_domain:
        description: destination is on another site
        type: boolean
      target:
        description: literal destination, when the page names one
        type: string
      to_ip:
        description: destination is a raw IP address
        type: boolean
    type: object
  checks.TLSResult:
    properties:
      ageDays:
        type: integer
      hostnameMismatch:
        type: boolean
      issuer:
        type: string
      present:
        type: boolean
    type: object
  domaininfo.RegistrationData:
    properties:
      age_days:
        description: total days since registration; null when unknown
        type: integer
      age_human:
        description: e.g. "2 years 3 months"; empty when unknown
        type: string
      age_known:
        description: |-
          Some registries (.de, .eu, …) don't publish a creation date. Then
          AgeKnown is false and AgeDays is null: a zero date would read as 2,025
          years old, and 0 would read as "registered today".
        type: boolean
      created:
        type: string
      dnssec:
        type: boolean
      domain:
        type: string
      expiry:
        type: string
      nameservers:
        items:
          type: string
        type: array
      raw:
        description: Raw WHOIS or RDAP JSON for debugging
        type: string
      registrar:
        type: string
      source:
        description: '"whois" or "rdap"'
        type: string
      status:
        items:
          type: string
        type: array
      updated:
        type: string
    type: object
  handler.KnownSitesResponse:
    properties:
      sites:
        items:
          type: string
        type: array
      user_content:
        items:
          type: string
        type: array
      version:
        type: string
    type: object
  handler.ReportRequest:
    properties:
      comment:
        maxLength: 1000
        type: string
      expected_verdict:
        enum:
        - Safe
        - Suspicious
        - Risky
        type: string
      score:
        type: integer
      url:
        maxLength: 2048
        type: string
      verdict:
        maxLength: 32
        type: string
    required:
    - url
    type: object
  handler.ThreatListResponse:
    properties:
      count:
        type: integer
      hash:
        example: sha256
        type: string
      prefix_len:
        example: 8
        type: integer
      prefixes:
        description: base64 of the sorted prefixes, back to back
        type: string
      sources:
        items:
          type: string
        type: array
      version:
        type: string
    type: object
  threatfeeds.FeedMatch:
    properties:
      checked:
        description: feeds that were loaded and checked
        items:
          type: string
        type: array
      listed:
        type: boolean
      match:
        description: '"url": this exact link; "host": another page on the same site'
        type: string
      sources:
        description: feeds that list it
        items:
          type: string
        type: array
    type: object
  threatfeeds.GoogleThreatResult:
    properties:
      expire_time:
        description: how long Google says the answer holds (Web Risk only)
        type: string
      listed:
        type: boolean
      threat_types:
        description: SOCIAL_ENGINEERING, MALWARE, UNWANTED_SOFTWARE
        items:
          type: string
        type: array
    type: object
  typosquat.TyposquatResult:
    properties:
      combo_exact:
        description: just the brand name, on another ending (roblox.dk)
        type: boolean
      distance:
        description: 0 for combo-squat
        type: integer
      embedded_domain:
        description: '"google.com" in accounts.google.com.example.fr'
        type: string
      is_combo_squat:
        type: boolean
      is_suspicious:
        type: boolean
      matched_brand:
        description: SLD only
        type: string
      matched_domain:
        type: string
      path_brand:
        description: '"paypal" in example.org/paypal-de/login'
        type: string
      subdomain_brand:
        description: Brand names in other parts of the URL (see CheckURLParts).
        type: string
      subdomain_brand_exact:
        description: the label is just the name (github.acme.com)
        type: boolean
    type: object
info:
  contact: {}
  description: URL safety analysis API. Checks phishing signals, redirects, TLS, DNS,
    brand mismatches, and more.
  license:
    name: AGPL-3.0
  title: url.vet API
  version: "1.0"
paths:
  /admin/cache:
    delete:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Flush all cache keys
      tags:
      - admin
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List all cache keys and values
      tags:
      - admin
  /admin/cache/{key}:
    delete:
      parameters:
      - description: Cache key
        in: path
        name: key
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete a single cache key
      tags:
      - admin
  /analyze:
    get:
      description: |-
        Runs every check in parallel and returns one scored report. Most clients only need
        result.verdict (Safe, Suspicious or Risky), result.final_score (0-100, higher is safer)
        and result.reasons. Checks still running after 15 seconds are dropped and named in
        incomplete_checks; incomplete is true when that could change the verdict. Complete
        results are cached for 24 hours per URL; incomplete ones are not cached.
      parameters:
      - description: URL to analyse (max 2048 chars)
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analyzer.Response'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Full URL analysis
      tags:
      - Analysis
  /depth:
    get:
      parameters:
      - description: URL to check
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: URL depth check
      tags:
      - URL
  /domain-info:
    get:
      parameters:
      - description: URL whose domain to look up
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Domain WHOIS / RDAP info
      tags:
      - DNS
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Utility
  /hsts:
    get:
      parameters:
      - description: URL to check
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: HSTS check
      tags:
      - Security
  /ip/check:
    get:
      parameters:
      - description: URL to check
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: IP address detection
      tags:
      - URL
  /ip/resolve:
    get:
      parameters:
      - description: URL whose domain to resolve
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: DNS IP resolution
      tags:
      - DNS
  /length:
    get:
      parameters:
      - description: URL to check
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: URL length check
      tags:
      - URL
  /lists/known-sites:
    get:
      description: The 10,000 most popular sites, and the user-content hosts on them
        that still need checking. A host matches a site if it is the site or a subdomain
        of it.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.KnownSitesResponse'
        "304":
          description: Not Modified
      summary: Well-known sites
      tags:
      - Lists
  /lists/threats:
    get:
      description: 'Known phishing and malware links (PhishTank, URLhaus) as sorted
        SHA-256 prefixes of each link''s normalized form: no scheme, lowercase host
        without "www.", no trailing slash or fragment, query kept. Clients hash a
        link the same way and look the prefix up locally, so nothing is sent. Supports
        If-None-Match.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ThreatListResponse'
        "304":
          description: Not Modified
      summary: Hashed threat list
      tags:
      - Lists
  /punycode:
    get:
      parameters:
      - description: URL to check
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Punycode detection
      tags:
      - URL
  /rank:
    get:
      parameters:
      - description: URL whose domain to rank
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Domain popularity rank
      tags:
      - DNS
  /redirects:
    get:
      parameters:
      - description: URL to check
        in: query
        name: url
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/checks.RedirectionResult'
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Redirect chain analysis
      tags:
      - Security
  /report:
    post:
      consumes:
      - application/json
      parameters:
      - description: Report details
        in: body
        name: report
        required: true
        schema:
          $ref: '#/definitions/handler.ReportRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
